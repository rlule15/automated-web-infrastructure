- name: Run updates on ubuntu servers
  ansible.builtin.apt:
    upgrade: dist
    update_cache: yes
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install packages on ubuntu servers
  ansible.builtin.apt:
    name: 
      - git
      - curl
      - wget
      - ufw
    state: latest
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Allows OpenSSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Block all incoming traffic by default
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Allow all outgoing traffic by default
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Enable UFW firewall
  community.general.ufw:
    state: enabled


